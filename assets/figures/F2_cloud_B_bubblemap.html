        <script charset="utf-8" src="https://cdn.plot.ly/plotly-3.5.0.min.js" integrity="sha256-fHbNLP+GlIXN+efbQec78UkemUz3NJp7UmfGxC1tNxs=" crossorigin="anonymous"></script>                <div id="e8cde136-a4af-457a-9e5a-392e02e40862" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script>                window.PLOTLYENV=window.PLOTLYENV || {};                                if (document.getElementById("e8cde136-a4af-457a-9e5a-392e02e40862")) {                    Plotly.newPlot(                        "e8cde136-a4af-457a-9e5a-392e02e40862",                        [{"customdata":[["Financial Banks","Pre 20.5 %  ·  Post 16.9 %  ·  Δ -3.6 pp","Before ChatGPT, financial bodies framed AI\u003cbr\u003ein finance as an emerging opportunity to\u003cbr\u003eextend existing supervisory architecture.\u003cbr\u003eThe BIS Financial Stability Institute set\u003cbr\u003ethe foundational position that existing\u003cbr\u003eprudential requirements on model governance,\u003cbr\u003erisk management, third-party dependency, and\u003cbr\u003eoperational resilience already apply to AI\u003cbr\u003emodels in banks. The tone was preparatory:\u003cbr\u003eextend, don't yet reinvent."],["Privacy","Pre 13.8 %  ·  Post 16.5 %  ·  Δ +2.7 pp","Before ChatGPT, the OECD led a principles-\u003cbr\u003earchitecture phase for trustworthy AI — AI\u003cbr\u003ePrinciples, system classification, the EU AI\u003cbr\u003eWhite Paper, human-rights-by-design — that\u003cbr\u003efinancial supervisors were expected to\u003cbr\u003einherit. Existing bank model-risk-management\u003cbr\u003eframeworks had not yet been extended to AI\u003cbr\u003ein finance. Privacy sat with accountability\u003cbr\u003eand fairness as principles, not yet\u003cbr\u003eoperational supervisory tools."],["Skills","Pre 8.2 %  ·  Post 10.8 %  ·  Δ +2.6 pp","Before ChatGPT, the OECD measured AI skills\u003cbr\u003eas a general labour-market problem; central-\u003cbr\u003ebank statisticians flagged a \"war for\u003cbr\u003etalent\" with the private sector for data\u003cbr\u003escientists able to staff suptech and\u003cbr\u003egranular-data work. Supervisory capacity was\u003cbr\u003etreated as a known constraint but not yet\u003cbr\u003ecentred."],["Workers","Pre 2.8 %  ·  Post 8.6 %  ·  Δ +5.8 pp","Before ChatGPT, the IMF and World Bank\u003cbr\u003eframed worker risk through the routine-task\u003cbr\u003eautomation lens because labour-market shifts\u003cbr\u003efeed back into financial stability via\u003cbr\u003ehousehold balance sheets and inequality.\u003cbr\u003eMiddle-skill jobs were seen as vulnerable,\u003cbr\u003ewomen over-represented in routine roles, and\u003cbr\u003edeveloping economies threatened by erosion\u003cbr\u003eof their cheap-labour comparative advantage.\u003cbr\u003eEstimates of jobs at risk varied widely and\u003cbr\u003ethe discussion stayed largely academic."],["Competition","Pre 5.5 %  ·  Post 3.4 %  ·  Δ -2.1 pp","Before ChatGPT, the OECD framed AI as a\u003cbr\u003ecompetition-enforcement challenge applicable\u003cbr\u003eto financial-services markets — algorithmic\u003cbr\u003etacit collusion in trading and pricing,\u003cbr\u003eanticompetitive mergers combining AI\u003cbr\u003ecapacity and financial datasets, and abuse\u003cbr\u003eof dominance via network effects on data and\u003cbr\u003escale. The question was whether existing\u003cbr\u003ecompetition law tools could capture AI-\u003cbr\u003eenabled harms in banking, lending, and\u003cbr\u003ecapital markets. Concern was about AI as a\u003cbr\u003etool firms might use, not about the AI\u003cbr\u003eindustry itself."],["Generative","Pre 0.2 %  ·  Post 4.7 %  ·  Δ +4.5 pp","Before ChatGPT, generative AI as a distinct\u003cbr\u003epolicy object barely existed in the\u003cbr\u003efinancial-policy database. Only three\u003cbr\u003epre-2022 paragraphs sit in this cluster —\u003cbr\u003eincidental mentions of AI-driven public-\u003cbr\u003eservice automation and early deepfake\u003cbr\u003eawareness — none framed as a generative-AI\u003cbr\u003eproblem for finance specifically. The\u003cbr\u003ecategory is essentially post-only by\u003cbr\u003econstruction."],["Exposure","Pre 0.1 %  ·  Post 4.5 %  ·  Δ +4.4 pp","Before ChatGPT, exposure analysis was an\u003cbr\u003eemerging IMF research line built on the\u003cbr\u003eFrey-Osborne automation framework. Almost no\u003cbr\u003epre-2022 paragraphs sit in this cluster —\u003cbr\u003ethe exposure-measurement tradition existed\u003cbr\u003ebut wasn't yet a major thread in the\u003cbr\u003efinancial-policy database. The category is\u003cbr\u003eessentially post-only."],["Regulatory","Pre 2.3 %  ·  Post 3.6 %  ·  Δ +1.3 pp","Before ChatGPT, the discussion among\u003cbr\u003efinancial-policy bodies centred on whether\u003cbr\u003eexisting prudential tools were adequate for\u003cbr\u003eAI in financial services, or whether new\u003cbr\u003einstruments were needed — sandboxes, soft-\u003cbr\u003elaw guidance, co-regulatory experiments. The\u003cbr\u003eOECD and IMF flagged fragmentation risks\u003cbr\u003efrom ad-hoc national rules, and World Bank\u003cbr\u003ework raised concerns that big tech was\u003cbr\u003esetting data-rules through trade agreements\u003cbr\u003ebinding financial regulators. The framing\u003cbr\u003ewas tentative: build the regulatory\u003cbr\u003earchitecture before AI forces the question."],["Financial Fintech","Pre 8.2 %  ·  Post 0.5 %  ·  Δ -7.7 pp","Before ChatGPT, this cluster captured the\u003cbr\u003e\"fintech era\" framing of financial-sector AI\u003cbr\u003e— IMF working papers on central-bank fintech\u003cbr\u003echallenges, the Bali Fintech Agenda's\u003cbr\u003ePrinciple X on operational risks from third-\u003cbr\u003eparty providers, FATF guidance on new\u003cbr\u003etechnologies for AML\u002fCFT, and early SupTech\u003cbr\u003eopportunities flagged by the BIS Financial\u003cbr\u003eStability Institute. AI was treated as one\u003cbr\u003etechnology within the broader fintech\u003cbr\u003etransformation. The framing was about\u003cbr\u003eupdating regulatory and supervisory\u003cbr\u003epractices to accommodate new intermediaries\u003cbr\u003eand business models."],["Supervisory","Pre 1.5 %  ·  Post 2.1 %  ·  Δ +0.6 pp","Before ChatGPT, the foundational\u003cbr\u003esupervisory-technology discussion centred on\u003cbr\u003ewhat AI could do for financial supervisors\u003cbr\u003eand how to start adopting it. The BIS\u003cbr\u003eFinancial Stability Institute called for a\u003cbr\u003e\"proportional and coordinated\" supervisory\u003cbr\u003eresponse distinguishing high-impact from\u003cbr\u003elow-impact AI uses by financial\u003cbr\u003einstitutions, and FSB surveys mapped early\u003cbr\u003eSupTech generations (descriptive and\u003cbr\u003ediagnostic analytics dominant; predictive\u003cbr\u003eand prescriptive uses rare). The agenda was\u003cbr\u003elargely aspirational."],["Patents","Pre 3.3 %  ·  Post 1.2 %  ·  Δ -2.1 pp","Before ChatGPT, the OECD's Science,\u003cbr\u003eTechnology and Innovation Directorate used\u003cbr\u003epatent and trademark data to identify AI-\u003cbr\u003erelated innovation, map AI-active firms, and\u003cbr\u003equantify technological developments. This\u003cbr\u003emeasurement work sits in the financial-\u003cbr\u003epolicy database because OECD policy reports\u003cbr\u003erely on it for context, but it is not\u003cbr\u003edirectly a supervisory concern. The framing\u003cbr\u003ewas descriptive and methodological."],["Explainability","Pre 1.2 %  ·  Post 1.5 %  ·  Δ +0.3 pp","Before ChatGPT, explainability was a\u003cbr\u003efoundational principle for AI in financial\u003cbr\u003eservices. The BIS Financial Stability\u003cbr\u003eInstitute and the OECD treated it as\u003cbr\u003eessential for accountability — supervisors\u003cbr\u003emust be able to audit AI outputs in\u003cbr\u003ecustomer-facing decisions (credit, pricing)\u003cbr\u003eand prudential decisions (capital adequacy).\u003cbr\u003eThe question was how to extend existing\u003cbr\u003emodel-risk-management frameworks (Basel,\u003cbr\u003eFederal Reserve SR 11-7) to AI\u002fML models,\u003cbr\u003ewith the UK FCA, France's ACPR, and the EU\u003cbr\u003edrafting initial sector guidance."],["Tax","Pre 0.9 %  ·  Post 1.5 %  ·  Δ +0.5 pp","Before ChatGPT, tax-administration AI was\u003cbr\u003ediscussed primarily by the World Bank as a\u003cbr\u003egovernment-modernisation issue with finance-\u003cbr\u003eadjacent implications — financial\u003cbr\u003eintelligence units using AI to track illicit\u003cbr\u003efund flows under FATF mandate, anti-fraud\u003cbr\u003esystems for government corruption risk, KYC\u003cbr\u003eand beneficial-ownership tracking. The\u003cbr\u003eframing was about enhancing rules-based\u003cbr\u003ecompliance systems with AI capabilities.\u003cbr\u003eDirect supervisory concern was limited to\u003cbr\u003ethe AML\u002fCFT interface."],["Harm","Pre 0.3 %  ·  Post 1.6 %  ·  Δ +1.3 pp","Before ChatGPT, AI harm and incidents barely\u003cbr\u003efeatured in the financial-policy database —\u003cbr\u003eonly five pre-2022 paragraphs in this\u003cbr\u003ecluster, mostly definitional or referring to\u003cbr\u003ethe OECD's nascent AI Incidents Tracker. The\u003cbr\u003econceptual apparatus (incidents, hazards,\u003cbr\u003eharm typologies) did not yet exist in\u003cbr\u003eoperational form. The category is\u003cbr\u003eessentially post-only."],["Financial Credit","Pre 0.1 %  ·  Post 1.3 %  ·  Δ +1.2 pp","Before ChatGPT, the AI-and-credit nexus\u003cbr\u003ebarely registered in the financial-policy\u003cbr\u003edatabase — only two pre-2022 paragraphs in\u003cbr\u003ethis cluster, both incidental. The category\u003cbr\u003eis essentially post-only."],["Women","Pre 3.1 %  ·  Post 0.4 %  ·  Δ -2.7 pp","Before ChatGPT, the OECD (with UNESCO and\u003cbr\u003eIDB) led the gender-and-AI conversation\u003cbr\u003ethrough \"The Effects of AI on the Working\u003cbr\u003eLives of Women\" — women's exposure to AI-\u003cbr\u003edriven automation, bias in AI-hiring\u003cbr\u003esystems, the gender gap among AI developers,\u003cbr\u003eand workplace-monitoring AI effects. World\u003cbr\u003eBank work raised tech-mediated harassment in\u003cbr\u003eSouth Asia. Finance entered the discussion\u003cbr\u003ethrough AI screening systems in credit and\u003cbr\u003ethe gender gap in fintech adoption."],["Vulnerabilities","Pre 0.1 %  ·  Post 1.1 %  ·  Δ +1.0 pp","Before ChatGPT, AI-specific vulnerabilities\u003cbr\u003efor financial authorities barely registered\u003cbr\u003ein the database — only two pre-2022\u003cbr\u003eparagraphs, both OECD discussing third-party\u003cbr\u003eand cloud-service risks for supervisory\u003cbr\u003eauthorities. The conceptual apparatus for\u003cbr\u003emonitoring AI-driven systemic risks did not\u003cbr\u003eyet exist. The category is essentially post-\u003cbr\u003eonly."],["Human","Pre 2.3 %  ·  Post 0.5 %  ·  Δ -1.8 pp","Before ChatGPT, this cluster captured\u003cbr\u003edefinitional and historical material — World\u003cbr\u003eBank, OECD, and BIS documents defining AI as\u003cbr\u003e\"machines performing human-like cognitive\u003cbr\u003efunctions\", tracing the discipline's\u003cbr\u003ehistory, and clarifying what counts as AI\u003cbr\u003eversus machine learning. The framing was\u003cbr\u003epreparatory and conceptual rather than\u003cbr\u003esubstantive: setting the language before\u003cbr\u003ediscussing policy."]],"hoverlabel":{"align":"left","bgcolor":"#EEEDE8","bordercolor":"#3a3a3a","font":{"color":"#222","family":"Inter, sans-serif","size":11}},"hovertemplate":"\u003cb\u003e%{customdata[0]}\u003c\u002fb\u003e\u003cbr\u003e%{customdata[1]}\u003cbr\u003e\u003cbr\u003e%{customdata[2]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"cmax":0.0772,"cmid":0,"cmin":-0.0772,"color":{"dtype":"f8","bdata":"XG3F\u002frJ7or8oXI\u002fC9SicPyxDHOviNpo\u002f93XgnBGlrT9S2ht8YTKVvytlGeJYF6c\u002fdy0hH\u002fRspj+oCkYldQKKP6VOQBNhw7O\u002f4pwRpb3Bdz+iZ7Pqc7WVvyxDHOviNmo\u002fiIVa07zjdD+0e\u002fKwUGuKP2fV52or9oc\u002fUpYhjnVxm7\u002f129eBc0aEP0hQ\u002fBhz15K\u002f"},"colorscale":[[0.0,"#A8A6A0"],[0.5,"#1F3A5F"],[1.0,"#C97B4A"]],"line":{"color":"white","width":1.2},"opacity":[0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88,0.88],"showscale":false,"size":[35.37467502751299,29.007531037225224,22.437106777030188,13.137824484274672,18.28707774216506,8,8,11.842274956524644,22.356830645691087,9.481408128202549,14.190472303963022,8.480429238831976,8,8,8,13.805138615686412,8,11.842274956524644]},"mode":"markers+text","name":"pre","showlegend":false,"text":["Financial Banks","Privacy","Skills","Workers","Competition","Generative","Exposure","Regulatory","Financial Fintech","Supervisory","Patents","Explainability","Tax","Harm","Financial Credit","Women","Vulnerabilities","Human"],"textfont":{"color":"#2E2C28","family":"Inter, sans-serif","size":11},"textposition":"top center","x":{"dtype":"f4","bdata":"f6dawB1WNcBr6B7AHzvzv+w2P8DjegHAQVL9v930ScCw\u002fGfA+HVqwOPzGMDR21TAcyJDwLnaLMBjnmTAPgPTvyHnXMDTVQzA"},"y":{"dtype":"f4","bdata":"7XxLQRw2TUGYTUlBSnZHQTJrRkEf1ExB4+hEQfHaSUEjCklB6UpRQVieQ0GJ2k9BLHVTQQH1UkHpLkZBp2tIQadaVEEXLkxB"},"type":"scatter","xaxis":"x","yaxis":"y"},{"customdata":[["Financial Banks","Pre 20.5 %  ·  Post 16.9 %  ·  Δ -3.6 pp","After ChatGPT, financial supervisors moved\u003cbr\u003eto active oversight. The FSB ran a\u003cbr\u003efinancial-stability stocktake on AI in\u003cbr\u003efinance, supervisors began addressing AI-\u003cbr\u003especific cyber and procyclicality risks\u003cbr\u003ewithin the prudential register, and central\u003cbr\u003ebanks examined the workforce implications of\u003cbr\u003eAI in their own institutions. The framing\u003cbr\u003eshifted from \"extend existing tools\" to\u003cbr\u003e\"address AI-specific financial-stability\u003cbr\u003echannels.\""],["Privacy","Pre 13.8 %  ·  Post 16.5 %  ·  Δ +2.7 pp","After ChatGPT, the architecture is being\u003cbr\u003eoperationalised in supervisory practice.\u003cbr\u003eBodies document concrete tooling — privacy-\u003cbr\u003eenhancing technologies, differential\u003cbr\u003eprivacy, anonymisation and re-identification\u003cbr\u003econtrols, regulatory sandboxes — and\u003cbr\u003epersonal-data-protection regimes\u003cbr\u003eincreasingly mandate data-protection\u003cbr\u003eofficers within banks. Privacy is now a live\u003cbr\u003eoperational concern for banks and their\u003cbr\u003esupervisors."],["Skills","Pre 8.2 %  ·  Post 10.8 %  ·  Δ +2.6 pp","After ChatGPT, the IMF turned skills and\u003cbr\u003einfrastructure into a financial-stability-\u003cbr\u003erelevant readiness gap measured by its AI\u003cbr\u003ePreparedness Index. The BIS makes the\u003cbr\u003esupervisory dimension explicit — central\u003cbr\u003ebanks now find recruiting in AI\u002fML, cyber,\u003cbr\u003eIT, and data science harder than five years\u003cbr\u003eago — and supervisory authorities\u003cbr\u003eincreasingly leverage cloud-based AI\u003cbr\u003eplatforms to close the gap. Human-capital\u003cbr\u003ereadiness now defines whether supervisors\u003cbr\u003ecan keep pace with AI-using banks."],["Workers","Pre 2.8 %  ·  Post 8.6 %  ·  Δ +5.8 pp","After ChatGPT, the labour framing inverted:\u003cbr\u003ehigh-income knowledge workers — including\u003cbr\u003efinance professionals — are now most\u003cbr\u003eexposed. The BIS documents a sharp gender\u003cbr\u003eand education gap in household gen-AI uptake\u003cbr\u003ethat mirrors the fintech gender gap, and IMF\u003cbr\u003eexposure–complementarity indices feed into\u003cbr\u003emonetary-policy and financial-stability\u003cbr\u003eassessments. Worker risk is now a finance-\u003cbr\u003estratified macro-financial variable, not a\u003cbr\u003egeneric labour-market story."],["Competition","Pre 5.5 %  ·  Post 3.4 %  ·  Δ -2.1 pp","After ChatGPT, the BIS and OECD reframed\u003cbr\u003ecompetition as a problem of the AI supply\u003cbr\u003echain itself — hardware, cloud, training\u003cbr\u003edata, foundation models, applications — with\u003cbr\u003edirect implications for bank operational\u003cbr\u003eresilience and concentration risk in the AI\u003cbr\u003estack banks depend on. National authorities\u003cbr\u003einvestigated cloud concentration in several\u003cbr\u003ejurisdictions, and supervisors began\u003cbr\u003eflagging foreclosure channels in Model-as-a-\u003cbr\u003eService and hyperscaler vertical\u003cbr\u003eintegration. The unit of analysis shifted\u003cbr\u003efrom \"competition in banking enabled by AI\"\u003cbr\u003eto \"competition within the AI stack on which\u003cbr\u003ebanks rely.\""],["Generative","Pre 0.2 %  ·  Post 4.7 %  ·  Δ +4.5 pp","After ChatGPT, GenAI lands on banking and\u003cbr\u003ecentral-banking agendas. The BIS debates AGI\u003cbr\u003escenarios for central-bank workforces,\u003cbr\u003edocuments that household trust in gen AI is\u003cbr\u003elowest in banking and public policy, and\u003cbr\u003eexamines AI applications in real-time\u003cbr\u003epayment systems; FATF and OECD raise\u003cbr\u003edeepfake and synthetic-media risks for fraud\u003cbr\u003eand AML. The AI-safety, alignment, and AGI\u003cbr\u003evocabulary enters the supervisory register."],["Exposure","Pre 0.1 %  ·  Post 4.5 %  ·  Δ +4.4 pp","After ChatGPT, the IMF built out the\u003cbr\u003eexposure–complementarity framework as the\u003cbr\u003edominant lens on AI's macro-labour effects,\u003cbr\u003econnected to financial stability via\u003cbr\u003einequality and productivity channels.\u003cbr\u003eFinance ranks among the highest-AI-exposure\u003cbr\u003esectors in this work, with implications for\u003cbr\u003esectoral productivity and bank operations.\u003cbr\u003eCountry-level exposure indices became inputs\u003cbr\u003eto IMF macro-financial assessments."],["Regulatory","Pre 2.3 %  ·  Post 3.6 %  ·  Δ +1.3 pp","After ChatGPT, the regulatory question\u003cbr\u003eturned into a coordination problem for\u003cbr\u003efinancial supervisors. The EU AI Act became\u003cbr\u003ea reference point overlapping with\u003cbr\u003eprudential frameworks; the US SEC issued\u003cbr\u003esectoral rules; emerging-market supervisors\u003cbr\u003echose wait-and-see to avoid overregulating\u003cbr\u003eearly. Bodies now frame fragmentation as a\u003cbr\u003ecompliance tax on fintech, and AI is\u003cbr\u003eentering the supervisory toolbox itself for\u003cbr\u003ecompliance-cost estimation and regulatory\u003cbr\u003eimpact assessment."],["Financial Fintech","Pre 8.2 %  ·  Post 0.5 %  ·  Δ -7.7 pp","After ChatGPT, this cluster shrinks sharply\u003cbr\u003e(8.2% → 0.5%) as the \"fintech era\" framing\u003cbr\u003egives way to AI-as-distinct-category, with\u003cbr\u003eGenAI, exposure, and competition topics\u003cbr\u003eabsorbing what fintech used to cover. The\u003cbr\u003eremaining post-period material narrows to\u003cbr\u003especific AI-in-finance concerns the BIS\u003cbr\u003eprioritises — LLM provider concentration as\u003cbr\u003ea financial-stability risk, quantum-\u003cbr\u003ecomputing threats to financial cryptography,\u003cbr\u003eAI in correspondent banking and AML, and\u003cbr\u003edeepfake fraud flagged by FATF. The volume\u003cbr\u003edrop is itself the story."],["Supervisory","Pre 1.5 %  ·  Post 2.1 %  ·  Δ +0.6 pp","After ChatGPT, supervisory AI moved from\u003cbr\u003easpirational to operational. The World Bank\u003cbr\u003eand IMF document specific deployments —\u003cbr\u003erisk-based supervision, AML\u002fCFT, consumer-\u003cbr\u003ecomplaint triage at Brazil's central bank,\u003cbr\u003ethe ECB automating data classification and\u003cbr\u003esupervisory-document parsing — while the BIS\u003cbr\u003epublishes governance frameworks for\u003cbr\u003esupervisors' own AI use. The discussion\u003cbr\u003eshifted from \"should supervisors adopt AI\"\u003cbr\u003eto \"how to manage the AI projects\u003cbr\u003esupervisors are already running.\""],["Patents","Pre 3.3 %  ·  Post 1.2 %  ·  Δ -2.1 pp","After ChatGPT, the OECD continued and\u003cbr\u003erefined this methodology — incorporating\u003cbr\u003egenerative-AI keywords, distinguishing core\u003cbr\u003eAI from AI-related applications, and\u003cbr\u003esurfacing AI-investment statistics. These\u003cbr\u003emetrics increasingly feed into productivity\u003cbr\u003eand growth scenarios used in financial-\u003cbr\u003estability assessments, but the topic itself\u003cbr\u003eremains measurement of AI as a technological\u003cbr\u003ephenomenon, not supervision."],["Explainability","Pre 1.2 %  ·  Post 1.5 %  ·  Δ +0.3 pp","After ChatGPT, explainability became an\u003cbr\u003eoperational supervisory concern. The BIS\u003cbr\u003eFinancial Stability Institute published\u003cbr\u003edetailed guidance on integrating AI into\u003cbr\u003eexisting model-risk-management regimes and\u003cbr\u003enoted that supervisors cannot trust the\u003cbr\u003eoutputs of models whose reasoning they\u003cbr\u003ecannot reconstruct; the OECD warned that\u003cbr\u003eGenAI massively accentuates the\u003cbr\u003eexplainability gap relative to classical ML.\u003cbr\u003eThe expectation hardened: financial\u003cbr\u003einstitutions must use inherently explainable\u003cbr\u003emodels for critical decisions, or supplement\u003cbr\u003eblack boxes with post-hoc techniques and\u003cbr\u003echallenger models."],["Tax","Pre 0.9 %  ·  Post 1.5 %  ·  Δ +0.5 pp","After ChatGPT, the World Bank documents\u003cbr\u003ewidespread AI adoption across tax\u003cbr\u003eadministrations — taxpayer-assistance\u003cbr\u003echatbots, risk assessment, fraud detection —\u003cbr\u003eand the BIS and OECD connect this to\u003cbr\u003efinancial supervision through KYC\u002fAML\u003cbr\u003eautomation in correspondent banking (a high-\u003cbr\u003erisk, low-margin activity supervisors\u003cbr\u003emonitor). The OECD documents specific\u003cbr\u003edeployments in France's DGFiP and Finland's\u003cbr\u003ePalkeet. The tax-administration angle\u003cbr\u003eremains adjacent rather than central to\u003cbr\u003efinancial supervision."],["Harm","Pre 0.3 %  ·  Post 1.6 %  ·  Δ +1.3 pp","After ChatGPT, the OECD built out an AI\u003cbr\u003eincident and hazard reporting framework —\u003cbr\u003edefining incidents and hazards, severity\u003cbr\u003eclassifications, harm typologies — that\u003cbr\u003efinancial supervisors will inherit alongside\u003cbr\u003eother regulators. The framework draws on\u003cbr\u003enuclear, aviation, and medical-device\u003cbr\u003eincident regimes and aligns with the EU AI\u003cbr\u003eAct's incident definitions. For financial\u003cbr\u003einstitutions, this becomes the template for\u003cbr\u003emandatory AI-incident disclosures to\u003cbr\u003esupervisors."],["Financial Credit","Pre 0.1 %  ·  Post 1.3 %  ·  Δ +1.2 pp","After ChatGPT, the IMF and BIS connect AI to\u003cbr\u003efinancial-stability surveillance — BIS work\u003cbr\u003efinds that AI-adopting banks behave more\u003cbr\u003ecounter-cyclically in credit, with\u003cbr\u003eimplications for monetary-policy\u003cbr\u003etransmission, and the IMF's stability-\u003cbr\u003emonitoring material on credit conditions,\u003cbr\u003ecommercial real estate, and market\u003cbr\u003evolatility increasingly references AI-driven\u003cbr\u003etrading and risk-management tools. The FSB\u003cbr\u003enotes that some firms use AI to manage\u003cbr\u003evolatility and liquidity risk. AI is being\u003cbr\u003eabsorbed into the existing financial-\u003cbr\u003estability surveillance toolkit."],["Women","Pre 3.1 %  ·  Post 0.4 %  ·  Δ -2.7 pp","After ChatGPT, the gender lens narrows but\u003cbr\u003esharpens around generative AI. The BIS\u003cbr\u003edocuments a significant gender gap in\u003cbr\u003ehousehold gen-AI uptake — explained\u003cbr\u003eprimarily by knowledge differences and\u003cbr\u003ewomen's stronger privacy preferences, which\u003cbr\u003eparallels the fintech gender gap — and the\u003cbr\u003eIMF examines gender-stratified AI exposure\u003cbr\u003ein green jobs. The OECD's earlier women-and-\u003cbr\u003eAI agenda continues but the post-period mass\u003cbr\u003eis small (3.1% → 0.4%) as gender concerns\u003cbr\u003eget absorbed into broader privacy, exposure,\u003cbr\u003eand consumer-protection topics."],["Vulnerabilities","Pre 0.1 %  ·  Post 1.1 %  ·  Δ +1.0 pp","After ChatGPT, the FSB built out a\u003cbr\u003ecomprehensive vulnerability-monitoring\u003cbr\u003eframework for AI in finance. Its 2024\u003cbr\u003estocktake identified vulnerabilities —\u003cbr\u003ethird-party dependencies, service-provider\u003cbr\u003econcentration, GenAI supply-chain risks,\u003cbr\u003emodel misalignment, market correlation\u003cbr\u003eeffects — and a 2025 follow-up identifies\u003cbr\u003edirect and proxy indicators (model\u003cbr\u003einventories, supervisory surveys, public AI\u003cbr\u003eadoption data) for national authorities to\u003cbr\u003emonitor them. The BCBS, IAIS, ECB, and FINMA\u003cbr\u003eecho the third-party-concentration concern."],["Human","Pre 2.3 %  ·  Post 0.5 %  ·  Δ -1.8 pp","After ChatGPT, the cluster shrinks (2.3% →\u003cbr\u003e0.5%) as definitional throat-clearing gives\u003cbr\u003eway to substantive AI-policy topics. The\u003cbr\u003eremaining material includes the EU AI Act's\u003cbr\u003eformal definitions, IMF F&D essays on AGI\u003cbr\u003escenarios, BIS retrospectives on AI in\u003cbr\u003efinance (GOFAI, expert systems for credit\u003cbr\u003escoring), and OECD work on AI compute.\u003cbr\u003eBodies still occasionally define AI to scope\u003cbr\u003enew instruments, but the conceptual framing\u003cbr\u003eis now settled."]],"hoverlabel":{"align":"left","bgcolor":"#EEEDE8","bordercolor":"#3a3a3a","font":{"color":"#222","family":"Inter, sans-serif","size":11}},"hovertemplate":"\u003cb\u003e%{customdata[0]}\u003c\u002fb\u003e\u003cbr\u003e%{customdata[1]}\u003cbr\u003e\u003cbr\u003e%{customdata[2]}\u003cextra\u003e\u003c\u002fextra\u003e","marker":{"cmax":0.0772,"cmid":0,"cmin <script>
(function() {
  function resizeAll() {
    var divs = document.querySelectorAll('.plotly-graph-div');
    if (!window.Plotly) return;
    divs.forEach(function(d) {
      try { window.Plotly.Plots.resize(d); } catch (e) {}
    });
  }

  // Observe the chart div(s) so Plotly resizes whenever the iframe's
  // own dimensions settle or change. Handles the case where Plotly
  // renders before the iframe knows its final size.
  function attachObservers() {
    if (!('ResizeObserver' in window)) return;
    var ro = new ResizeObserver(function() { resizeAll(); });
    document.querySelectorAll('.plotly-graph-div').forEach(function(d) {
      ro.observe(d);
    });
    ro.observe(document.body);
  }

  function init() {
    resizeAll();
    attachObservers();
    // Belt-and-braces: nudge a few times during the first second in
    // case Plotly is still initialising when the observers attach.
    var t = 0;
    var iv = setInterval(function() {
      resizeAll();
      if ((t += 200) >= 1000) clearInterval(iv);
    }, 200);
  }

  if (document.readyState === 'complete') init();
  else window.addEventListener('load', init);
  window.addEventListener('resize', resizeAll);
})();
</script>
